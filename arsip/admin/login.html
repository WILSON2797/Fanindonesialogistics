<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Admin CMS Fis Logistics</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CSS with Cache Busting -->
  <script>
    document.write('<link rel="stylesheet" href="../assets/css/main.css?v=' + Date.now() + '">');
    document.write('<link rel="stylesheet" href="../assets/css/admin.css?v=' + Date.now() + '">');
  </script>
</head>

<body>
  <div id="app">
    <div class="login-page">
      <div class="login-card">
        <div class="login-brand">
          <i class="bi bi-truck"></i>
        </div>
        <h2>Admin CMS</h2>
        <p>PT. Fis Logistics</p>
        
        <div class="alert alert-error" v-if="error" style="margin-bottom: 20px; padding: 12px; border-radius: 12px; background: #fee2e2; color: #991b1b; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;">
          <i class="bi bi-exclamation-circle-fill"></i> {{ error }}
        </div>

        <form @submit.prevent="login">
          <div class="form-group">
            <label>Username</label>
            <input class="form-control" v-model="username" required placeholder="admin" autofocus>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input class="form-control" type="password" v-model="password" required placeholder="••••••••">
          </div>
          <button class="btn btn-primary" type="submit" :disabled="loading">
            <i class="bi" :class="loading?'bi-arrow-repeat':'bi-box-arrow-in-right'"></i>
            <span>{{ loading ? 'Loading...' : 'Login' }}</span>
          </button>
        </form>
        <p style="text-align:center;margin-top:16px;font-size:.8rem;color:var(--text-light)">
          <a href="../" style="color:var(--primary); font-weight: 600;">&larr; Kembali ke Website</a>
        </p>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    // Cache busting - selalu ambil file terbaru
    (function () {
      const _v = Date.now();
      const el = document.createElement("script");
      el.src = "../assets/js/api.js?v=" + _v;
      document.currentScript.parentNode.insertBefore(el, document.currentScript.nextSibling);
    })();
  </script>
  <script>
    Vue.createApp({
      data() { return { username: '', password: '', loading: false, error: '' }; },
      methods: {
        async login() {
          this.loading = true; this.error = '';
          try {
            await api.login(this.username, this.password);
            window.location.href = 'index.html';
          } catch (e) { this.error = e.message || 'Login gagal.'; }
          this.loading = false;
        }
      }
    }).mount('#app');
  </script>
</body>

</html>
